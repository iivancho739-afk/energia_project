{% extends "base.html" %}
{% block title %}Eliminar conjunto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4">
                <h5>¿Eliminar "{{ conjunto.nombre }}"?</h5>
                <p class="text-muted">Se eliminarán también sus {{ conjunto.total_registros }} registros. Esta acción no se puede deshacer.</p>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'graficas:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
